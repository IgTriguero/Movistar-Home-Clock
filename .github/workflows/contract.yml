name: Source contract

on:
  schedule:
    # Diario a las 06:17 UTC.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Contrato diario de fuentes
        run: >-
          HOMECLOCK_CONTRACT=1 ./gradlew --no-daemon testDebugUnitTest
          --tests 'com.itriguero.homeclock.SourceContractTest' --rerun-tasks

      - name: Subir informe de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: source-contract-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7
