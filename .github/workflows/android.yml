name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Tests, lint y APK debug
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verificar que el tag coincide con la versión
        run: |
          VERSION=$(grep '^HOMECLOCK_VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con HOMECLOCK_VERSION_NAME=${VERSION}" >&2
            exit 1
          fi

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/homeclock-release.jks"

      - name: Compilar release firmada
        env:
          HOMECLOCK_KEYSTORE: ${{ runner.temp }}/homeclock-release.jks
          HOMECLOCK_STOREPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          HOMECLOCK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HOMECLOCK_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Preparar APK y update.json
        id: assets
        run: |
          VERSION=$(grep '^HOMECLOCK_VERSION_NAME=' gradle.properties | cut -d= -f2)
          CODE=$(grep '^HOMECLOCK_VERSION_CODE=' gradle.properties | cut -d= -f2)
          APK="homeclock-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > update.json <<EOF
          {
            "versionCode": ${CODE},
            "versionName": "${VERSION}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK}",
            "sha256": "${SHA}",
            "notes": "Actualización de HomeClock ${VERSION}."
          }
          EOF
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          cat update.json

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.assets.outputs.apk }}
            update.json
          generate_release_notes: true
