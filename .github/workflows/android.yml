name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Tests, lint y APK debug
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verificar tag y changelog
        run: |
          VERSION=$(grep '^HOMECLOCK_VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con HOMECLOCK_VERSION_NAME=${VERSION}" >&2
            exit 1
          fi
          if [ ! -s "docs/release-notes/${VERSION}.md" ]; then
            echo "Falta el changelog: docs/release-notes/${VERSION}.md" >&2
            exit 1
          fi

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/homeclock-release.jks"

      - name: Compilar release firmada
        env:
          HOMECLOCK_KEYSTORE: ${{ runner.temp }}/homeclock-release.jks
          HOMECLOCK_STOREPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          HOMECLOCK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HOMECLOCK_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Preparar APK, changelog y update.json
        id: assets
        run: |
          VERSION=$(grep '^HOMECLOCK_VERSION_NAME=' gradle.properties | cut -d= -f2)
          CODE=$(grep '^HOMECLOCK_VERSION_CODE=' gradle.properties | cut -d= -f2)
          NOTES_FILE="docs/release-notes/${VERSION}.md"
          APK="homeclock-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          python3 tools/update_manifest.py \
            --version "$VERSION" \
            --code "$CODE" \
            --apk "$APK" \
            --sha "$SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE" \
            --output update.json
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          cat update.json

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.assets.outputs.apk }}
            update.json
          body_path: ${{ steps.assets.outputs.notes_file }}
